services:
  # ── Development ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: budgeting-postgres-dev
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: budgeting
      POSTGRES_PASSWORD: budgeting_dev
      POSTGRES_DB: budgeting
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgeting"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["dev"]

  # ── Production (VPS) ────────────────────────────────────
  app:
    image: ghcr.io/wernervandermerwe/budgeting-app:latest
    container_name: budgeting-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"
    env_file: .env.production
    networks:
      - default
      - infra
    profiles: ["production"]

volumes:
  pgdata-dev:

networks:
  infra:
    external: true
    name: infra_default   # verified on VPS 2026-07-08 (docker network ls)
